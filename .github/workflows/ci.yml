name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS build and differential test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          swift --version
          node --version
          python3 --version

      # The differential test executes the frozen QML service under node and
      # the Swift port over identical fixtures, then diffs every derived
      # figure. It is the guarantee that the history format and the numbers
      # derived from it have not drifted.
      - name: Differential test
        working-directory: macos
        run: ./test-macos.sh

      # No OAuth client is injected here: CI must prove the app builds and
      # behaves without baked credentials, which is the source-build path.
      - name: Build app bundle
        working-directory: macos
        run: ./build-macos.sh

      - name: Verify bundle
        working-directory: macos
        run: |
          APP=dist/Pomodoro.app
          test -x "$APP/Contents/MacOS/Pomodoro"
          test -f "$APP/Contents/Resources/Pomodoro.icns"
          test -f "$APP/Contents/Resources/scripts/pomodoro_whistler_import.py"
          # A source build must not contain credentials.
          if [ -f "$APP/Contents/Resources/scripts/google-calendar-client.json" ]; then
            echo "unexpected OAuth client in a CI build" >&2
            exit 1
          fi
          ./dist/Pomodoro.app/Contents/MacOS/Pomodoro --status

      # Build the DMG on every run so packaging breakage surfaces here rather
      # than during a release. No credentials, so this is not distributable.
      - name: Package DMG
        working-directory: macos
        env:
          VERSION: 0.0.0-ci
        run: |
          ./package-macos.sh
          DMG=$(ls dist/*.dmg)
          hdiutil attach "$DMG" -nobrowse -readonly -mountpoint /tmp/dmgcheck -quiet
          test -d /tmp/dmgcheck/Pomodoro.app
          test -L /tmp/dmgcheck/Applications
          hdiutil detach /tmp/dmgcheck -quiet

      - name: Lint Python bridges
        run: python3 -m compileall -q scripts

  windows:
    name: Windows build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Show toolchain
        shell: bash
        run: |
          dotnet --version
          node --version
          python --version

      - name: Build
        working-directory: windows
        run: dotnet build Pomodoro.sln --configuration Release --nologo

      # The same reference and fixtures the macOS test uses, so both ports are
      # held to one behavior rather than to each other.
      - name: Differential test
        working-directory: windows
        shell: pwsh
        run: ./test-windows.ps1

      # WinUI must be built with Visual Studio's MSBuild, not `dotnet build`:
      # the resource-index (PRI) tasks WindowsAppSDK invokes ship with VS, not
      # with the .NET SDK, so the SDK's MSBuild fails with MSB4062.
      - name: Build WinUI app
        working-directory: windows
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $msbuild = & $vswhere -latest -products * `
            -requires Microsoft.Component.MSBuild `
            -find MSBuild\**\Bin\MSBuild.exe | Select-Object -First 1
          if (-not $msbuild) { throw 'MSBuild not found' }
          Write-Host "using $msbuild"
          & $msbuild src\Pomodoro.App\Pomodoro.App.csproj -restore `
            -p:Configuration=Release -p:Platform=x64 -p:RuntimeIdentifier=win-x64 -v:minimal
          if ($LASTEXITCODE -ne 0) { throw 'WinUI build failed' }

      # A downloadable build on every run, so the app can be tried in a VM
      # without a Windows toolchain. No credentials: this is not a release.
      - name: Package portable build
        working-directory: windows
        shell: pwsh
        run: ./build-windows.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: pomodoro-windows-ci
          path: |
            windows/dist/*.exe
            windows/dist/*.zip
            windows/dist/*.sha256
          if-no-files-found: error

      - name: Report resolved package versions
        if: always()
        working-directory: windows
        shell: bash
        run: |
          # The csproj floats patch versions; record what actually resolved so
          # they can be pinned deliberately.
          grep -hoE '"(Microsoft\.WindowsAppSDK|Microsoft\.Windows\.SDK\.BuildTools)/[0-9][^"]*"' \
            src/Pomodoro.App/obj/project.assets.json 2>/dev/null | sort -u || true
