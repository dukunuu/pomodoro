name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. 1.2.3); no release is published'
        required: true

permissions:
  contents: write

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      publish: ${{ steps.resolve.outputs.publish }}
    steps:
      - id: resolve
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

  macos:
    name: macOS
    needs: version
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Differential test
        working-directory: macos
        run: ./test-macos.sh

      # The release carries the project's own Google Desktop OAuth client, so
      # users only approve access instead of creating a Cloud project. See
      # docs/releasing.md — a Desktop client's secret is not confidential and
      # is extractable from any distributed binary; PKCE is what protects the
      # flow, and the auth bridge already uses S256.
      # UNIVERSAL=1 is required for a release: a single-slice arm64 build
      # will not launch on an Intel Mac at all.
      - name: Build universal bundle
        working-directory: macos
        env:
          VERSION: ${{ needs.version.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
          UNIVERSAL: '1'
          GOOGLE_OAUTH_CLIENT_JSON: ${{ secrets.GOOGLE_OAUTH_CLIENT_JSON }}
        run: |
          if [ -z "${GOOGLE_OAUTH_CLIENT_JSON:-}" ]; then
            echo "::warning::GOOGLE_OAUTH_CLIENT_JSON is not set; \
              the release will require each user to install their own client"
          fi
          ./build-macos.sh

      - name: Package DMG
        working-directory: macos
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: ./package-macos.sh

      - name: Verify DMG
        working-directory: macos
        run: |
          DMG=$(ls dist/*.dmg)
          hdiutil attach "$DMG" -nobrowse -readonly -mountpoint /tmp/dmgcheck -quiet
          test -d /tmp/dmgcheck/Pomodoro.app
          test -L /tmp/dmgcheck/Applications
          lipo -archs /tmp/dmgcheck/Pomodoro.app/Contents/MacOS/Pomodoro \
            | tee /dev/stderr | grep -q arm64
          lipo -archs /tmp/dmgcheck/Pomodoro.app/Contents/MacOS/Pomodoro | grep -q x86_64
          hdiutil detach /tmp/dmgcheck -quiet

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            macos/dist/*.dmg
            macos/dist/*.dmg.sha256
          if-no-files-found: error

  windows:
    name: Windows
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detect project
        id: detect
        shell: bash
        run: |
          if [ -f windows/Pomodoro.sln ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::windows/Pomodoro.sln not present yet; no Windows artifact"
          fi

      - uses: actions/setup-dotnet@v4
        if: steps.detect.outputs.exists == 'true'
        with:
          dotnet-version: '8.0.x'

      # Contract for when the WinUI app lands: build-windows.ps1 publishes a
      # self-contained x64 build, wraps it in an Inno Setup installer, and
      # writes windows/dist/Pomodoro-<version>-windows-x64.exe plus a
      # .sha256 beside it.
      - name: Build installer
        if: steps.detect.outputs.exists == 'true'
        working-directory: windows
        shell: pwsh
        env:
          VERSION: ${{ needs.version.outputs.version }}
          GOOGLE_OAUTH_CLIENT_JSON: ${{ secrets.GOOGLE_OAUTH_CLIENT_JSON }}
        run: ./build-windows.ps1

      - uses: actions/upload-artifact@v4
        if: steps.detect.outputs.exists == 'true'
        with:
          name: windows
          path: |
            windows/dist/*.exe
            windows/dist/*.exe.sha256
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [version, macos, windows]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          ls -la artifacts
          # A tag with no macOS artifact means the build silently failed.
          test -n "$(ls artifacts/*.dmg 2>/dev/null)" || {
            echo "no DMG in artifacts" >&2
            exit 1
          }
          cat > notes.md <<'NOTES'
          ### Downloads

          - **macOS** — `.dmg`, universal (Apple silicon and Intel). Open it and
            drag Pomodoro to Applications.
          - **Windows** — `.exe` installer (x64).

          Builds carry the project's Google OAuth client, so setup is just:
          authorize Google, then configure Whistler.

          Both downloads are unsigned. On macOS, right-click the app and choose
          Open the first time; on Windows, More info → Run anyway. SHA-256
          checksums are attached.
          NOTES
          gh release create "v$VERSION" \
            --title "v$VERSION" \
            --generate-notes \
            --notes-file notes.md \
            artifacts/*
